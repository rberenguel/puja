<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puja</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./media/favicon.ico" type="image/x-icon" />
    <link href="fonts/inter.css" rel="stylesheet" />
    <link href="fonts/monoid.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div class="ui-container">
      <div id="height-score">0</div>
      <div id="precision-score">0</div>
      <div id="special-palette-toast" style="display: none"></div>
      <div id="instructions">
        <span class="restart">Click to start and place the block</span>
      </div>
    </div>

    <script src="./libs/three.min.js"></script>
    <script src="./libs/cannon.min.js"></script>

    <script type="module" src="./js/main.js">
      // --- Game Setup ---
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").then(
            function (registration) {
              console.log(
                "ServiceWorker registration successful with scope: ",
                registration.scope,
              );
            },
            function (err) {
              console.log("ServiceWorker registration failed: ", err);
            },
          );
        });
      } else {
        console.info("Service workers not available on this device");
      }
    </script>
  </body>
</html>
