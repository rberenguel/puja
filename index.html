<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puja</title>
		  <link rel="manifest" href="./manifest.json" />
			    <link href="fonts/inter.css" rel="stylesheet" />
    <link href="fonts/monoid.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'monoidregular', monospace;
              user-select: none;
  touch-action: manipulation;
  -webkit-user-select: none;
  -moz-user-select: none;
        }
        #game-canvas {
            display: block;
        }
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        #height-score {
            position: absolute;
            top: 1rem;
            width: 100%;
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0px 2px 6px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }
        #precision-score {
            position: absolute;
            top: 4rem;
            width: 100%;
            text-align: center;
            font-size: 0.8em;
            font-weight: 700;
            text-shadow: 0px 1px 4px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            transition: color 0.5s;
        }
        #instructions {
             background-color: rgba(255, 255, 255, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            pointer-events: auto;
            position: absolute;
            bottom: 20px;
						font-size: 1.0rem;
        }
				#instructions .restart { font-size: 0.8rem; display: block; margin-top: 0.5rem;}
        #special-palette-toast {
            position: absolute;
            top: 7rem;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            opacity: 1;
            transition: opacity 1s ease-in-out;
            font-size: 1.2rem;
            font-weight: bold;
        }
        #special-palette-toast.fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <div class="ui-container">
        <div id="height-score">0</div>
        <div id="precision-score">0</div>
        <div id="special-palette-toast" style="display: none;"></div>
        <div id="instructions"><span class="restart">Click to start and place the block</span></div>
    </div>

    <script src="./libs/three.min.js"></script>
    <script src="./libs/cannon.min.js"></script>

    <script type="module" src="./js/main.js">
        // --- Game Setup ---

    </script>
		    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").then(
            function (registration) {
              console.log(
                "ServiceWorker registration successful with scope: ",
                registration.scope,
              );
            },
            function (err) {
              console.log("ServiceWorker registration failed: ", err);
            },
          );
        });
      } else {
        console.info("Service workers not available on this device");
      }
    </script>
</body>
</html>
